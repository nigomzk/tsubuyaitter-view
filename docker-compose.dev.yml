version: '3.8'

services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tsubuyaitter-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=info
      - LOG_OUTPUT=logs/application.log
      - WATCHPACK_POLLING=true
    develop:
      watch:
        - action: sync
          path: .
          target: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - postgres
      - redis

  # Database
  postgres:
    image: postgres:16-alpine
    container_name: tsubuyaitter-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tsubuyaitter_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Cache
  redis:
    image: redis:7-alpine
    container_name: tsubuyaitter-redis
    ports:
      - "6379:6379"

  # Object Storage (S3 Compatible)
  minio:
    image: minio/minio
    container_name: tsubuyaitter-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Email Testing
  mailcatcher:
    image: schickling/mailcatcher
    container_name: tsubuyaitter-mailcatcher
    ports:
      - "1025:1025" # SMTP
      - "1080:1080" # Web UI

volumes:
  postgres_data:
  minio_data:
